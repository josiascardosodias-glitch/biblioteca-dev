<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Vamos utilizar algumas imagens Dinâmicas:</p>
    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="foto para computador">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <h2>Vamos tocar uma música:</h2>
    <audio preload="auto" autoplay controls loop>
        <source src="media/happye.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador <strong>não consegue</strong> tocar o áudio</p>
        <p>Baixe o áudio mp3 através do link: <a href="media/happye.mp3">Link para baixar áudio</a></p>
    </audio>
    <p> Ouça essa linda musiquinha.</p>
    <h2>ouça também o nosso podcast:</h2>
    <audio preload="metadata" controls>
        <source src="media/podcast.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador <strong>não consegue</strong> tocar o áudio</p>
        <p>Baixe o áudio mp3 através do link: <a href="media/podcast.mp3">Link para baixar áudio</a></p>
    </audio>   
</body>
</html>
