<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulando vidios</title>
</head>
<body>
    <h1>Desafio com vidios</h1>
    <p>Hoje nós vamos mecher um pouco com a manipulação de vidios no nosso saite</p>
    <video width="500" height="300" controls poster="imagens/planta.webp">
        <source src="midia/Meu-Vidio-mp4.mp4" type="video/mp4">
        <source src="midia/Meu-Vidio-webm.webm" type="video/webm">
        <p>infelizmente o seu navegador não é compativel com o vidio</p>
        <p>Baixe o video atráves do link: </p> <a href="midia/Meu-Vidio-mp4.mp4"> video mp4 para dowload.</a>
    </video>
    <h1>Incorporando Videos Externos</h1>
    <h2>Do youtube:</h2>
    <iframe width="500" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=BvkzPHHO0JWDJdNx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h2>Do Vimeo:</h2>
    <iframe title="vimeo-player" src="https://player.vimeo.com/video/177118397?h=52d138b00e" width="500" height="315" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
