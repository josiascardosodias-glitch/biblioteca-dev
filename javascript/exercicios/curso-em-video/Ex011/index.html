<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidades</title>
</head>
<body>
    <h1>Sistema de países</h1>
    Qual é o seu país de origem: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">        
    </div>
    <script>
        function verificar() {
            var txtv = document.querySelector('#txtpais')
            var res = document.querySelector('#res')
            // Read value, trim whitespace and normalize to lowercase for comparison
            var pais = txtv.value.trim()
            if (pais.length === 0) {
                res.innerHTML = '<p>Por favor, digite o nome do país.</p>'
                return
            }
            res.innerHTML = `<p>Você é do país ${pais}</p>`
            // Compare against the string 'brasil' (case-insensitive)
            if (pais.toLowerCase() !== 'brasil') {
                res.innerHTML += '<p>Você é estrangeiro!</p>'
            } else {
                res.innerHTML += '<p>Você é brasileiro!</p>'
            }
        } 
    </script>
</body>
</html>
