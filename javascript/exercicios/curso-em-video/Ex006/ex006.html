<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
        #area {
            width: 100px;
            height: 100px;
            background-color: rgb(159, 235, 159);
            text-align: center;
            line-height: 100px;
            font-size: 18px;
            margin: 50px auto;
            border: 2px solid green;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>
<body>
    <div id="area">
        interaja...
    </div>

    <script>
        var area = window.document.getElementById("area")
        area.addEventListener("click", clicar)
        area.addEventListener("mouseenter", entrar)
        area.addEventListener("mouseout", sair)

        function clicar() {
            area.innerText = "Clicou!"
            area.style.background = "rgb(235, 159, 159)"
            area.style.border = "2px solid red"
        }
        function entrar() {
            area.innerText = "Entrou!"
        }
        function sair() {
            area.innerText = "interaja..."
            area.style.background = "rgb(159, 235, 159)"
            area.style.border = "2px solid green"
        }
    </script>
</body>
</html>
