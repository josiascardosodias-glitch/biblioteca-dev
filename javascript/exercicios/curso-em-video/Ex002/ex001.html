<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <style>
        body {
            text-align: center;
            background-color: rgb(128, 204, 240);
            color: rgb(67, 33, 218);
        }
        p {
            text-align: justify;
            font-size: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>olá</title>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi animi beatae, sed ipsum ipsam placeat asperiores sunt laboriosam? Doloribus, aspernatur hic? Iste possimus iusto praesentium ipsa tempora eius nulla quidem.</p>
    <script>
        var nome = window.prompt("Qual o seu nome?"); // pergunta o nome...
        window.alert('Olá ' + nome + '!, seja bem vindo ao nosso site!'); // o sinal de + serve para concatenar os textos e as suas variaveis.
    </script>
</body>
</html>
